<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Good Nature">
<meta name="theme-color" content="#FAF6F0">
<title>Good Nature</title>
<link rel="apple-touch-icon" href="https://goodnaturesupplies.github.io/gn-finance/apple-touch-icon.png?v=2">
<link rel="icon" href="https://goodnaturesupplies.github.io/gn-finance/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Good Nature home (departments). Drawn straight from GitHub so it opens instantly (31/10/2026);
   each app still checks who may open it. Same look as the old Apps Script home page. */
:root{--brown:#86593d;--brown2:#a0704f;--deep:#5c3a24;--gold:#c9962e;--bg:#f6f2ec;--card:#fff;--ink:#2a211b;--mut:#776b61;--line:#e7dfd5}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
header{background:#fff;border-bottom:3px solid var(--brown);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:14px}
header .brand svg{height:44px !important;width:auto !important;max-width:none !important;display:block}
header .ttl{font-size:13px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);border-inline-start:1px solid var(--line);padding-inline-start:14px}
[dir=rtl] header .ttl{letter-spacing:0}
.langbtn{margin-inline-start:auto;flex-shrink:0;background:#fff;color:var(--brown);border:1px solid var(--brown);border-radius:14px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
main{max-width:920px;margin:0 auto;padding:28px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.hello{margin:0 0 22px}.hello h1{font-family:Poppins,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:26px;margin:0;color:var(--deep)}
[dir=rtl] .hello h1{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.hello p{margin:6px 0 0;color:var(--mut)}
.depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;align-items:start}
a.dept{display:flex;flex-direction:column;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;min-width:0}
a.dept:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--brown)}
a.dept.store:before{background:var(--gold)}a.dept.hr:before{background:#6f8a5a}
a.dept:hover{border-color:var(--brown2);box-shadow:0 8px 24px rgba(92,58,36,.12);transform:translateY(-2px)}
a.dept:active{transform:translateY(0)}
.dtop{display:flex;align-items:flex-start;gap:14px}
.dic{flex-shrink:0;width:54px;height:54px;border-radius:14px;background:#f3ebe2;color:var(--brown);display:flex;align-items:center;justify-content:center}
.store .dic{background:#f8efdc;color:#9c7016}.hr .dic{background:#eef2e8;color:#55703f}.dic svg{width:28px;height:28px}
.dtx{flex:1;min-width:0}.dtx h2{font-family:Poppins,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:21px;margin:2px 0 4px;color:var(--deep)}
[dir=rtl] .dtx h2{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.dtx p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}
.arrow{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--brown);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:10px}
.store .arrow{background:var(--gold)}.hr .arrow{background:#6f8a5a}[dir=rtl] .arrow{transform:scaleX(-1)}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--mut)}
#hint{display:none;margin:22px auto 0;max-width:420px;text-align:center;font-size:13px;color:var(--mut);line-height:1.6}
#splash{position:fixed;inset:0;z-index:100;background:#FAF6F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .25s ease}
#splash.out{opacity:0;pointer-events:none}#splash svg{width:260px;max-width:76vw;height:auto}
#splash .spin{width:26px;height:26px;border-radius:50%;border:3px solid #E6D8CB;border-top-color:#8B4F2E;animation:gnspin .9s linear infinite}@keyframes gnspin{to{transform:rotate(360deg)}}
@media (max-width:600px){header{padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}header .brand svg{height:36px !important}header .ttl{letter-spacing:.15em;font-size:12px;padding-inline-start:10px}
main{padding-top:20px}.hello h1{font-size:21px}a.dept{padding:18px;border-radius:16px;gap:14px}.dic{width:46px;height:46px}.dtx h2{font-size:19px}}
</style>
</head>
